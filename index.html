let state={mode:"menu", pool:[],pos:0,score:0,wrong:[],answered:false,history:JSON.parse(localStorage.getItem("sgWrong")||"[]")};

function save(){localStorage.setItem("sgWrong",JSON.stringify(state.history))}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function menu(){
state.mode="menu";
document.getElementById("app").innerHTML=`<div class="card">
<h1>Test wiedzy do Straży Granicznej</h1>
<div class="small">Zestaw 200 pytań z oficjalnej strony Straży Granicznej.</div>
<div class="menu">
<button onclick="startLearn()">📚 Nauka — wszystkie 200</button>
<button onclick="startExam()">🎯 Egzamin — 10 losowych</button>
<button onclick="startWrong()">🔴 Tylko błędne (${state.history.length})</button>
<button class="secondary" onclick="resetWrong()">🗑 Wyczyść błędy</button>
</div>
<div class="stats" style="margin-top:20px"><span>Zapamiętane błędy: <b>${state.history.length}</b></span><span>Postęp zapisuje się automatycznie.</span></div>
</div>`}
function startLearn(){state.mode="learn";state.pool=shuffle(QUESTIONS);state.pos=0;state.score=0;state.wrong=[];state.answered=false;render()}
function startExam(){state.mode="exam";state.pool=shuffle(QUESTIONS).slice(0,10);state.pos=0;state.score=0;state.wrong=[];state.answered=false;render()}
function startWrong(){
let p=state.history.map(id=>QUESTIONS.find(x=>x.id===id)).filter(Boolean);
if(!p.length){alert("Nie masz jeszcze zapisanych błędów.");return}
state.mode="wrong";state.pool=shuffle(p);state.pos=0;state.score=0;state.wrong=[];state.answered=false;render()
}
function resetWrong(){state.history=[];save();menu()}
function render(){
if(state.pos>=state.pool.length){finish();return}
let x=state.pool[state.pos], labels=["A","B","C","D"];
let order=shuffle([0,1,2,3]); // randomize answer positions
state.order=order;
document.getElementById("app").innerHTML=`<div class="card">
<div class="stats"><span>Pytanie <b>${state.pos+1}/${state.pool.length}</b></span><span>Wynik <b>${state.score}</b></span><span>Oficjalny nr <b>${x.id}</b></span></div>
<div class="bar"><div class="fill" style="width:${((state.pos)/state.pool.length)*100}%"></div></div>
<div class="q">${esc(x.q)}</div>
<div class="answers">${order.map((idx,i)=>`<button class="ans" id="a${idx}" onclick="answer(${idx})"><b>${labels[i]}.</b> ${esc(x.a[idx])}</button>`).join("")}</div>
<div id="feedback"></div>
<div class="controls"><button class="secondary" onclick="menu()">← Menu</button><button id="next" class="hidden" onclick="next()">Następne →</button></div>
</div>`}
function answer(idx){
if(state.answered)return;
state.answered=true;let x=state.pool[state.pos];
document.querySelectorAll(".ans").forEach(b=>b.classList.add("disabled"));
let correct=idx===x.correct;
document.getElementById("a"+x.correct).classList.add("good");
if(!correct){document.getElementById("a"+idx).classList.add("bad");state.wrong.push(x.id);if(!state.history.includes(x.id)){state.history.push(x.id);save()}}
else state.score++;
let fb=document.getElementById("feedback");
fb.innerHTML=`<div class="feedback ${correct?"goodbox":"badbox"}">${correct?"✅ DOBRZE!":"❌ ŹLE!"}<br><span style="font-weight:500">Prawidłowa odpowiedź: ${esc(x.a[x.correct])}</span></div>`;
document.getElementById("next").classList.remove("hidden");
}
function next(){state.pos++;state.answered=false;render()}
function finish(){
let total=state.pool.length,pct=Math.round(state.score/total*100);
document.getElementById("app").innerHTML=`<div class="card">
<h1>${state.mode==="exam"?"Egzamin zakończony":"Sesja zakończona"}</h1>
<div style="font-size:42px;font-weight:900;margin:20px 0">${state.score}/${total}</div>
<div class="stats"><span>Wynik: <b>${pct}%</b></span><span>Błędy w tej sesji: <b>${state.wrong.length}</b></span><span>Łącznie zapisanych błędów: <b>${state.history.length}</b></span></div>
<div class="menu"><button onclick="${state.mode==="exam"?"startExam()":"startLearn()"}">🔄 Jeszcze raz</button><button onclick="startWrong()">🔴 Przećwicz błędy</button><button class="secondary" onclick="menu()">← Menu</button></div>
${state.wrong.length?`<div class="list">${state.wrong.map(id=>{let q=QUESTIONS.find(x=>x.id===id);return `<div class="row"><b>${id}.</b> ${esc(q.q)} <span class="tag">błąd</span></div>`}).join("")}</div>`:""}
</div>`}
menu();
</script>
