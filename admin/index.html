<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#071426"><title>Panel administratora — TESTREKRUT</title>
<style>
:root{color-scheme:dark;--bg:#071426;--panel:#10243a;--line:#29435f;--text:#edf4fb;--muted:#a7b8ca;--blue:#168df0;--green:#19bd76;--amber:#e7a83c;--red:#e15d68}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#12345a 0,transparent 42%),var(--bg);font:15px system-ui,Segoe UI,Arial;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #328bd4;background:linear-gradient(135deg,#126fbd,#168df0);color:#fff;border-radius:9px;padding:10px 15px;font-weight:750}button:disabled{opacity:.5;cursor:wait}.secondary{background:#142b43;border-color:#3a5570}.danger{background:#54232b;border-color:#a84b57}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.brand{font-size:24px;font-weight:900;letter-spacing:-.5px}.brand span{color:#45b2ff}.muted{color:var(--muted)}.panel{background:rgba(13,31,50,.94);border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 15px 45px #0004}.login{max-width:430px;margin:12vh auto;text-align:center}.login p{line-height:1.6;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat b{display:block;font-size:30px;margin-top:6px}.stat span{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar select{background:#0a1b2d;color:#fff;border:1px solid var(--line);border-radius:9px;padding:10px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #243d56;vertical-align:middle}th{font-size:12px;color:#9fb4c8;text-transform:uppercase;letter-spacing:.06em}.status{display:inline-block;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:800}.pending{background:#4a3818;color:#ffd37d}.paid{background:#123f31;color:#8af0c2}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{font-size:12px;padding:7px 9px}.message{margin:12px 0;padding:12px;border-radius:9px;background:#132e49;color:#cce7ff;display:none}.message.error{background:#4a2028;color:#ffc2c7}.hidden{display:none!important}.right{display:flex;align-items:center;gap:12px}.email{font-size:13px;color:var(--muted)}@media(max-width:760px){.wrap{padding:14px}.top{align-items:flex-start}.stats{grid-template-columns:1fr 1fr}.stat b{font-size:25px}.panel{padding:14px}}
</style></head><body><main class="wrap">
<section id="loginView" class="panel login"><div class="brand">TEST<span>REKRUT</span></div><h1>Panel administratora</h1><p>Logowanie wyłącznie przez konto Google administratora.</p><button id="loginBtn">Zaloguj przez Google</button><div id="loginMsg" class="message"></div></section>
<section id="appView" class="hidden"><header class="top"><div><div class="brand">TEST<span>REKRUT</span> / ADMIN</div><div class="muted">Zarządzanie zamówieniami i dostępami</div></div><div class="right"><span id="adminEmail" class="email"></span><button id="logoutBtn" class="secondary">Wyloguj</button></div></header>
<div class="stats"><div class="panel stat"><span>Wszystkie zamówienia</span><b id="total">—</b></div><div class="panel stat"><span>Oczekujące</span><b id="pending">—</b></div><div class="panel stat"><span>Opłacone</span><b id="paid">—</b></div><div class="panel stat"><span>Przychód brutto</span><b id="revenue">—</b></div></div>
<section class="panel"><div class="toolbar"><h2 style="margin:0;margin-right:auto">Zamówienia</h2><select id="filter"><option value="all">Wszystkie</option><option value="pending">Oczekujące</option><option value="paid">Opłacone</option></select><button id="refreshBtn" class="secondary">Odśwież</button></div><div id="notice" class="message"></div><div class="table-wrap"><table><thead><tr><th>Numer</th><th>Data</th><th>Klient</th><th>Formacja</th><th>Kwota</th><th>Status</th><th>Akcje</th></tr></thead><tbody id="ordersBody"><tr><td colspan="7" class="muted">Ładowanie…</td></tr></tbody></table></div></section>
</section></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDhF58VCYjnZh9nTP8jX2yEUAjLkvy2oCo",authDomain:"test-wiedzy-sg.firebaseapp.com",projectId:"test-wiedzy-sg",storageBucket:"test-wiedzy-sg.firebasestorage.app",messagingSenderId:"505553329961",appId:"1:505553329961:web:f9f0d18a0953136204e138"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const fn=firebase.app().functions('europe-central2');
const $=id=>document.getElementById(id);const ADMIN='testrekrut.pl@gmail.com';
function notice(message,error=false){$('notice').textContent=message;$('notice').className='message'+(error?' error':'');$('notice').style.display='block'}
function money(g){return (Number(g||0)/100).toLocaleString('pl-PL',{style:'currency',currency:'PLN'})}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function call(name,data={}){return (await fn.httpsCallable(name)(data)).data}
async function load(){ $('ordersBody').innerHTML='<tr><td colspan="7">Ładowanie…</td></tr>';try{const [d,o]=await Promise.all([call('getDashboard'),call('listOrders',{status:$('filter').value,limit:200})]);$('total').textContent=d.total;$('pending').textContent=d.pending;$('paid').textContent=d.paid;$('revenue').textContent=money(d.revenueGrosz);$('ordersBody').innerHTML=o.orders.length?o.orders.map(x=>`<tr><td><b>${safe(x.number)}</b></td><td>${x.createdAt?new Date(x.createdAt).toLocaleString('pl-PL'):'—'}</td><td>${safe(x.email)}</td><td>${safe(x.productLabel)}</td><td>${money(x.amountGrosz)}</td><td><span class="status ${x.status==='paid'?'paid':'pending'}">${x.status==='paid'?'Opłacone':'Oczekuje'}</span></td><td><div class="actions">${x.status==='pending'?`<button data-confirm="${safe(x.id)}">Potwierdź wpłatę</button>`:`<button class="secondary" data-resend="${safe(x.id)}">Wyślij kod ponownie</button>`}</div></td></tr>`).join(''):'<tr><td colspan="7" class="muted">Brak zamówień.</td></tr>';}catch(e){notice(e.message||'Nie udało się pobrać zamówień.',true)}}
$('loginBtn').onclick=async()=>{try{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});await auth.signInWithPopup(p)}catch(e){$('loginMsg').textContent=e.message;$('loginMsg').style.display='block'}};
$('logoutBtn').onclick=()=>auth.signOut();$('refreshBtn').onclick=load;$('filter').onchange=load;
$('ordersBody').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.confirm||b.dataset.resend;if(!id)return;b.disabled=true;try{if(b.dataset.confirm){if(!confirm('Czy potwierdzasz, że płatność rzeczywiście wpłynęła?'))return;const r=await call('confirmPayment',{orderId:id});notice(`Płatność potwierdzona. Kod: ${r.code}. E-mail wysłany.`)}else{const r=await call('resendAccessEmail',{orderId:id});notice(`Ponownie wysłano istniejący kod: ${r.code}`)}await load()}catch(err){notice(err.message||'Operacja nie powiodła się.',true)}finally{b.disabled=false}};
auth.onAuthStateChanged(async user=>{if(!user){$('loginView').classList.remove('hidden');$('appView').classList.add('hidden');return}if(user.email!==ADMIN||!user.emailVerified){await auth.signOut();$('loginMsg').textContent='To konto nie ma uprawnień administratora.';$('loginMsg').style.display='block';return}$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('adminEmail').textContent=user.email;await load()});
</script></body></html>
