<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TESTREKRUT — Przygotuj się do rekrutacji</title>
<meta name="description" content="TESTREKRUT — platforma przygotowująca do testów wiedzy do Straży Granicznej i Policji.">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#061019;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

.stage{
  position:relative;
  width:100vw;
  margin:0;
  line-height:0;
}

.design{
  display:block;
  width:100vw;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}

/* Ukrywamy wyłącznie nieaktywne menu z prawej strony.
   Logo TESTREKRUT po lewej zostaje nietknięte. */
.top-nav-cover{
  position:absolute;
  z-index:5;
  top:0;
  right:0;
  width:38%;
  height:12.5%;
  background:linear-gradient(
    180deg,
    rgba(5,15,23,.97) 0%,
    rgba(5,15,23,.90) 68%,
    rgba(5,15,23,0) 100%
  );
  pointer-events:none;
}

/* Karty SG i Policji */
.hit{
  position:absolute;
  display:block;
  z-index:10;
  cursor:pointer;
  border-radius:20px;
  -webkit-tap-highlight-color:transparent;
}

.hit:hover{
  background:rgba(255,255,255,.025);
}

.sg-card{
  left:3.25%;
  top:45.25%;
  width:35.7%;
  height:31.4%;
}

.police-card{
  left:40.25%;
  top:45.25%;
  width:35.7%;
  height:31.4%;
}

/*
  PRAWDZIWA STOPKA HTML.
  Zastępuje stopkę tekstową z grafiki, dzięki czemu:
  - tekst jest ostry,
  - kontakt jest statyczny,
  - przyciski są prawdziwie klikalne.
*/
.footer{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  min-height:74px;
  padding:10px 3.2%;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:24px;
  background:rgba(3,12,20,.97);
  border-top:1px solid rgba(120,190,230,.16);
  line-height:normal;
}

.footer-left{
  display:flex;
  align-items:center;
  gap:15px;
  min-width:0;
}

.footer-brand{
  color:#f4f7fa;
  font-size:12px;
  font-weight:900;
  letter-spacing:1.3px;
  white-space:nowrap;
}

.footer-divider{
  width:1px;
  height:22px;
  background:rgba(255,255,255,.16);
}

.footer-description{
  color:#71818e;
  font-size:10px;
  white-space:nowrap;
}

.footer-contact{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  white-space:nowrap;
}

.contact-label{
  color:#b9c6cf;
  font-size:10px;
  font-weight:700;
  letter-spacing:.45px;
}

.contact-buttons{
  display:flex;
  gap:7px;
}

.contact-btn{
  height:36px;
  min-width:108px;
  padding:0 13px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border-radius:8px;
  color:#fff;
  text-decoration:none;
  font-size:10px;
  font-weight:800;
  letter-spacing:.15px;
  transition:transform .15s ease,filter .15s ease,box-shadow .15s ease;
}

.contact-btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.contact-btn svg{
  width:17px;
  height:17px;
  flex:none;
}

.contact-btn.whatsapp{
  background:linear-gradient(135deg,#08783f,#0a9b54);
  border:1px solid #39d57d;
  box-shadow:0 5px 18px rgba(14,150,80,.18);
}

.contact-btn.messenger{
  background:linear-gradient(135deg,#1557c5,#2477ee);
  border:1px solid #5794ff;
  box-shadow:0 5px 18px rgba(35,105,220,.18);
}

.footer-right{
  display:flex;
  justify-content:flex-end;
  color:#64737e;
  font-size:9px;
  white-space:nowrap;
}

/* Telefon */
@media(max-width:900px){
  .footer{
    grid-template-columns:1fr;
    justify-items:center;
    gap:9px;
    padding:12px;
  }

  .footer-left,
  .footer-contact,
  .footer-right{
    justify-content:center;
  }

  .footer-description,
  .footer-right{
    display:none;
  }

  .footer{
    min-height:112px;
  }
}

@media(max-width:700px){
  .contact-label{
    display:none;
  }

  .contact-btn{
    min-width:125px;
    height:38px;
    font-size:10px;
  }
}
</style>
</head>

<body>

<div class="stage">

  <img
    class="design"
    src="homepage-design.png"
    alt="TESTREKRUT — przygotuj się do rekrutacji"
  >

  <!-- Nieaktywne zakładki: ukryte. Logo pozostaje widoczne. -->
  <div class="top-nav-cover" aria-hidden="true"></div>

  <!-- Klikalne karty -->
  <a class="hit sg-card"
     href="/SG/"
     aria-label="Przejdź do testu Straż Graniczna"></a>

  <a class="hit police-card"
     href="/policja/"
     aria-label="Przejdź do testu Policja"></a>

  <!-- Statyczna stopka -->
  <footer class="footer">

    <div class="footer-left">
      <div class="footer-brand">TESTREKRUT</div>
      <div class="footer-divider"></div>
      <div class="footer-description">
        Platforma przygotowawcza do testów rekrutacyjnych
      </div>
    </div>

    <div class="footer-contact">

      <div class="contact-label">
        MASZ PYTANIE? SKONTAKTUJ SIĘ Z NAMI:
      </div>

      <div class="contact-buttons">

        <a
          class="contact-btn whatsapp"
          href="https://wa.me/48608737181"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Skontaktuj się przez WhatsApp">

          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.1 1.6 5.8L.2 24l6.6-1.7a11.8 11.8 0 0 0 5.3 1.3h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.1-1.2-6.1-3.5-8.3ZM12.2 21.5h-.1c-1.7 0-3.4-.5-4.8-1.3l-.3-.2-3.9 1 1-3.8-.2-.3a9.7 9.7 0 1 1 8.3 4.6Zm5.3-7.3c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-1.6-.8-2.6-1.4-3.7-3.2-.3-.5.3-.5.8-1.7.1-.2.1-.4 0-.6-.1-.2-.7-1.7-.9-2.3-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1-1.1 2.5s1.1 2.9 1.3 3.1c.2.2 2.2 3.4 5.4 4.7.8.3 1.4.5 1.8.6.8.2 1.5.2 2 .1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.1-1.4-.1-.2-.3-.3-.6-.4Z"/>
          </svg>
          WhatsApp
        </a>

        <a
          class="contact-btn messenger"
          href="https://m.me/tomasz.pawlak.54"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Skontaktuj się przez Messenger">

          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 1.8C5.8 1.8 1 6.3 1 12c0 3.2 1.6 6.1 4.3 8.1V24l3.9-2.1c.9.2 1.8.3 2.8.3 6.2 0 11-4.5 11-10.2S18.2 1.8 12 1.8Zm1 13.6-2.8-3-5.5 3 6-6.4 2.8 3 5.4-3-5.9 6.4Z"/>
          </svg>
          Messenger
        </a>

      </div>
    </div>

    <div class="footer-right">
      © 2026 TESTREKRUT. Wszelkie prawa zastrzeżone.
    </div>

  </footer>

</div>

</body>
</html>
