<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TESTREKRUT — Przygotuj się do rekrutacji</title>
<meta name="description" content="TESTREKRUT — platforma przygotowująca do testów wiedzy do Straży Granicznej i Policji.">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#061019;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

.stage{
  position:relative;
  width:100vw;
  margin:0;
  line-height:0;
}

.design{
  display:block;
  width:100vw;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}

/* Ukrywamy wyłącznie nieaktywne zakładki.
   Logo TESTREKRUT pozostaje widoczne. */
.top-nav-cover{
  position:absolute;
  z-index:5;
  top:0;
  right:0;
  width:38%;
  height:12.5%;
  background:linear-gradient(
    180deg,
    rgba(5,15,23,.97) 0%,
    rgba(5,15,23,.90) 68%,
    rgba(5,15,23,0) 100%
  );
  pointer-events:none;
}

/* Klikalne karty */
.hit{
  position:absolute;
  display:block;
  z-index:10;
  cursor:pointer;
  border-radius:20px;
  -webkit-tap-highlight-color:transparent;
}

.hit:hover{
  background:rgba(255,255,255,.025);
}

.sg-card{
  left:3.25%;
  top:45.25%;
  width:35.7%;
  height:31.4%;
}

.police-card{
  left:40.25%;
  top:45.25%;
  width:35.7%;
  height:31.4%;
}


.site-footer{
  position:absolute;
  z-index:25;
  left:0;
  bottom:0;
  width:100%;
  height:4.65vw;
  min-height:0;
  box-sizing:border-box;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;
  align-items:center;
  gap:2vw;
  padding:0 2vw;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.15;
  background:#031827;
  border-top:1px solid rgba(92,155,188,.28);
}

.footer-brand{
  min-width:0;
  display:flex;
  align-items:center;
  gap:.6vw;
  white-space:nowrap;
}

.footer-brand-name{
  white-space:nowrap;
  font-weight:800;
  letter-spacing:-.035em;
  font-size:1.65vw;
  line-height:1;
}

.brand-test{color:#fff}
.brand-rekrut{color:#159cf0}
.brand-year{
  color:#e9f0f4;
  font-weight:500;
  margin-left:4px;
}

.footer-divider{
  color:rgba(255,255,255,.5);
  font-size:1.35vw;
  margin:0 3px;
}

.footer-platform{
  color:rgba(255,255,255,.76);
  font-size:.78vw;
  white-space:nowrap;
}

.footer-contact{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  white-space:nowrap;
}

.mail-icon{
  color:#9fc6df;
  font-size:1.35vw;
  line-height:1;
  transform:translateY(-1px);
}

.contact-text{
  color:rgba(255,255,255,.88);
  font-size:.78vw;
}

.contact-buttons{
  display:flex;
  align-items:center;
  gap:.6vw;
}

.contact-btn{
  height:2.6vw;
  min-width:8.75vw;
  padding:0 1.1vw;
  box-sizing:border-box;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.55vw;
  border-radius:6px;
  color:#fff;
  text-decoration:none;
  font-size:.78vw;
  font-weight:700;
  box-shadow:0 2px 7px rgba(0,0,0,.28);
  transition:filter .15s ease,transform .15s ease;
}

.contact-btn:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
}

.contact-btn svg{
  width:1.3vw;
  height:1.3vw;
  flex:none;
}

.contact-btn.whatsapp{
  background:#0b9f55;
  border:1px solid #24c96e;
}

.contact-btn.messenger{
  background:#1677e8;
  border:1px solid #4b9cff;
}

.footer-copy{
  text-align:left;
  color:rgba(255,255,255,.82);
  font-size:.72vw;
  line-height:1.45;
  white-space:nowrap;
}

@media(max-width:1250px){
  .site-footer{
    gap:1.4vw;
    padding:0 1.5vw;
  }
  .footer-platform{font-size:.68vw}
  .footer-contact{gap:.55vw}
  .contact-text{font-size:.68vw}
  .contact-btn{
    min-width:7vw;
    height:2.15vw;
    padding:0 .75vw;
    font-size:.68vw;
  }
  .contact-btn svg{
    width:1vw;
    height:1vw;
  }
  .footer-copy{font-size:.62vw}
}

@media(max-width:700px){
  html,body{
    width:100%;
    min-width:0;
    margin:0;
    padding:0;
    overflow-x:hidden;
  }

  .stage{
    position:relative;
    width:100vw;
    max-width:100vw;
    min-width:0;
    margin:0;
    overflow:hidden;
  }

  /*
    Telefon: pokazujemy CAŁĄ grafikę w szerokości ekranu.
    Nie używamy już 205vw/225vw, które powodowały obcinanie lewej i prawej strony.
  */
  .design{
    display:block;
    width:100vw !important;
    max-width:100vw !important;
    height:auto !important;
    margin:0 !important;
  }

  .hit{
    border-radius:8px;
  }

  /* Pozycje klikanych kart pozostają zgodne z grafiką. */
  .sg-card{
    left:3.25%;
    top:45.25%;
    width:35.7%;
    height:31.4%;
  }

  .police-card{
    left:40.25%;
    top:45.25%;
    width:35.7%;
    height:31.4%;
  }

  /* Niska, prosta stopka mobilna. */
  .site-footer{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:0 10px;
    background:#031827;
  }

  .footer-brand{
    min-width:0;
    flex:1 1 auto;
    overflow:hidden;
  }

  .footer-brand-name{
    font-size:18px;
  }

  .footer-divider,
  .footer-platform,
  .mail-icon,
  .contact-text{
    display:none;
  }

  .footer-contact{
    flex:0 0 auto;
    gap:6px;
  }

  .contact-buttons{
    gap:5px;
  }

  .contact-btn{
    width:40px;
    min-width:40px;
    height:36px;
    padding:0;
    border-radius:6px;
  }

  .contact-btn span{
    display:none;
  }

  .contact-btn svg{
    width:19px;
    height:19px;
  }

  .footer-copy{
    display:block;
    flex:0 0 auto;
    font-size:9px;
    line-height:1.25;
  }
}

@media(max-width:420px){
  .site-footer{
    height:54px;
    padding:0 8px;
  }

  .footer-brand-name{
    font-size:16px;
  }

  .contact-btn{
    width:34px;
    min-width:34px;
    height:32px;
  }

  .contact-btn svg{
    width:17px;
    height:17px;
  }

  .footer-copy{
    font-size:8px;
  }
}

.site-footer,
.site-footer *{
  transform:none;
  -webkit-user-select:none;
  user-select:none;
}

</style>
</head>

<body>

<div class="stage">

  <img
    class="design"
    src="homepage-design-clean.png"
    alt="TESTREKRUT — przygotuj się do rekrutacji"
  >

  <!-- Ukrywa nieaktywne elementy nawigacji w grafice -->
  <div class="top-nav-cover" aria-hidden="true"></div>

  <!-- Klikalne karty -->
  <a
    class="hit sg-card"
    href="/SG/"
    aria-label="Przejdź do testu Straż Graniczna"></a>

  <a
    class="hit police-card"
    href="/policja/"
    aria-label="Przejdź do testu Policja"></a>

  <!-- Prawdziwy tekst HTML — nie jest częścią grafiki -->
  <footer class="site-footer">

    <div class="footer-brand">
      <div class="footer-brand-name">
        <span class="brand-test">TEST</span><span class="brand-rekrut">REKRUT</span>
        <span class="brand-year">2026</span>
      </div>
      <span class="footer-divider">|</span>
      <span class="footer-platform">Platforma przygotowawcza do testów rekrutacyjnych</span>
    </div>

    <div class="footer-contact">
      <span class="mail-icon" aria-hidden="true">✉</span>
      <span class="contact-text">Masz pytanie? Skontaktuj się z nami:</span>

      <div class="contact-buttons">
        <a class="contact-btn whatsapp"
           href="https://wa.me/48608737181"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="WhatsApp"
           title="WhatsApp">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.1 1.6 5.8L.2 24l6.6-1.7a11.8 11.8 0 0 0 5.3 1.3h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.1-1.2-6.1-3.5-8.3ZM12.2 21.5h-.1c-1.7 0-3.4-.5-4.8-1.3l-.3-.2-3.9 1 1-3.8-.2-.3a9.7 9.7 0 1 1 8.3 4.6Zm5.3-7.3c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-1.6-.8-2.6-1.4-3.7-3.2-.3-.5.3-.5.8-1.7.1-.2.1-.4 0-.6-.1-.2-.7-1.7-.9-2.3-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1-1.1 2.5s1.1 2.9 1.3 3.1c.2.2 2.2 3.4 5.4 4.7.8.3 1.4.5 1.8.6.8.2 1.5.2 2 .1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.1-1.4-.1-.2-.3-.3-.6-.4Z"/>
          </svg>
          <span>WhatsApp</span>
        </a>

        <a class="contact-btn messenger"
           href="https://m.me/tomasz.pawlak.54"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Messenger"
           title="Messenger">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 1.8C5.8 1.8 1 6.3 1 12c0 3.2 1.6 6.1 4.3 8.1V24l3.9-2.1c.9.2 1.8.3 2.8.3 6.2 0 11-4.5 11-10.2S18.2 1.8 12 1.8Zm1 13.6-2.8-3-5.5 3 6-6.4 2.8 3 5.4-3-5.9 6.4Z"/>
          </svg>
          <span>Messenger</span>
        </a>
      </div>
    </div>

    <div class="footer-copy">
      <div>© 2026 TESTREKRUT.</div>
      <div>Wszelkie prawa zastrzeżone.</div>
    </div>

  </footer>

</div>


<script>
(function () {
  window.addEventListener('wheel', function (e) {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
    }
  }, { passive: false });
})();
</script>

</body>
</html>
