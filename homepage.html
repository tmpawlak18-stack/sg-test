<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TESTREKRUT — Przygotuj się do rekrutacji</title>
<meta name="description" content="TESTREKRUT — platforma przygotowująca do testów wiedzy do Straży Granicznej i Policji.">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#061019;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

.stage{
  position:relative;
  width:100vw;
  margin:0;
  line-height:0;
}

.design{
  display:block;
  width:100vw;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}

/* Ukrywamy wyłącznie nieaktywne zakładki.
   Logo TESTREKRUT pozostaje widoczne. */
.top-nav-cover{
  position:absolute;
  z-index:5;
  top:0;
  right:0;
  width:38%;
  height:12.5%;
  background:linear-gradient(
    180deg,
    rgba(5,15,23,.97) 0%,
    rgba(5,15,23,.90) 68%,
    rgba(5,15,23,0) 100%
  );
  pointer-events:none;
}

/* Klikalne karty */
.hit{
  position:absolute;
  display:block;
  z-index:10;
  cursor:pointer;
  border-radius:20px;
  -webkit-tap-highlight-color:transparent;
}

.hit:hover{
  background:rgba(255,255,255,.025);
}

.sg-card{
  left:3.25%;
  top:45.25%;
  width:35.7%;
  height:31.4%;
}

.police-card{
  left:40.25%;
  top:45.25%;
  width:35.7%;
  height:31.4%;
}


.site-footer{
  position:absolute;
  z-index:25;
  left:0;
  bottom:0;
  width:100%;
  height:6%;
  min-height:48px;
  display:grid;
  grid-template-columns:1.45fr 1fr .72fr;
  align-items:center;
  padding:0 2.1%;
  gap:2%;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.15;
  background:linear-gradient(
    180deg,
    rgba(2,17,29,.48) 0%,
    rgba(2,17,29,.82) 100%
  );
  border-top:1px solid rgba(74,145,181,.34);
}

.footer-brand,
.footer-contact,
.footer-copy{
  min-width:0;
}

.brand-line{
  display:flex;
  align-items:center;
  gap:.7vw;
  min-width:0;
  white-space:nowrap;
}

.brand-title{
  white-space:nowrap;
  font-weight:800;
  letter-spacing:-.03em;
  font-size:clamp(16px,1.35vw,26px);
  line-height:1;
}

.brand-test{color:#fff}
.brand-rekrut{color:#159cf0}
.brand-year{
  color:#e9f0f4;
  font-weight:500;
  margin-left:.28em;
}

.brand-separator{
  color:rgba(255,255,255,.45);
  font-size:clamp(12px,.8vw,16px);
}

.brand-subtitle{
  color:rgba(255,255,255,.76);
  font-size:clamp(8px,.62vw,12px);
  letter-spacing:.01em;
  white-space:nowrap;
}

.footer-contact{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.55vw;
  white-space:nowrap;
}

.contact-text{
  color:rgba(255,255,255,.88);
  font-size:clamp(9px,.68vw,13px);
}

.contact-buttons{
  display:flex;
  align-items:center;
  gap:5px;
  flex:none;
}

.contact-btn{
  width:28px;
  height:28px;
  padding:0;
  box-sizing:border-box;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#fff;
  text-decoration:none;
  box-shadow:0 2px 7px rgba(0,0,0,.25);
  transition:filter .15s ease;
}

.contact-btn:hover{filter:brightness(1.1)}

.contact-btn svg{
  width:16px;
  height:16px;
  flex:none;
}

.contact-btn.whatsapp{
  background:linear-gradient(135deg,#08783f,#0a9b54);
  border:1px solid #39d57d;
}

.contact-btn.messenger{
  background:linear-gradient(135deg,#1557c5,#2477ee);
  border:1px solid #5794ff;
}

.footer-copy{
  text-align:right;
  color:rgba(255,255,255,.82);
  font-size:clamp(8px,.58vw,12px);
  line-height:1.35;
}

@media(max-width:900px){
  .site-footer{
    grid-template-columns:1.2fr 1fr .7fr;
    padding:0 1.5%;
    gap:1%;
  }
  .footer-contact{
    gap:5px;
  }
  .contact-btn{
    width:24px;
    height:24px;
  }
  .contact-btn svg{
    width:14px;
    height:14px;
  }
}

@media(max-width:600px){
  .site-footer{
    height:8%;
    min-height:42px;
    grid-template-columns:1fr auto;
  }
  .footer-contact{
    grid-column:2;
    grid-row:1;
  }
  .footer-brand{
    grid-column:1;
    grid-row:1;
  }
  .footer-copy{
    display:none;
  }
  .brand-subtitle,
  .contact-text{
    display:none;
  }
}

</style>
</head>

<body>

<div class="stage">

  <img
    class="design"
    src="homepage-design-clean.png"
    alt="TESTREKRUT — przygotuj się do rekrutacji"
  >

  <!-- Ukrywa nieaktywne elementy nawigacji w grafice -->
  <div class="top-nav-cover" aria-hidden="true"></div>

  <!-- Klikalne karty -->
  <a
    class="hit sg-card"
    href="/SG/"
    aria-label="Przejdź do testu Straż Graniczna"></a>

  <a
    class="hit police-card"
    href="/policja/"
    aria-label="Przejdź do testu Policja"></a>

  <!-- Prawdziwy tekst HTML — nie jest częścią grafiki -->
  <footer class="site-footer">

    <div class="footer-brand">
      <div class="brand-line">
        <span class="brand-title">
          <span class="brand-test">TEST</span><span class="brand-rekrut">REKRUT</span>
          <span class="brand-year">2026</span>
        </span>
        <span class="brand-separator">|</span>
        <span class="brand-subtitle">Platforma przygotowawcza do testów rekrutacyjnych</span>
      </div>
    </div>

    <div class="footer-contact">
      <span class="contact-text">Masz pytanie? Skontaktuj się z nami:</span>

      <div class="contact-buttons">
        <a
          class="contact-btn whatsapp"
          href="https://wa.me/48608737181"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="WhatsApp — skontaktuj się"
          title="WhatsApp">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.1 1.6 5.8L.2 24l6.6-1.7a11.8 11.8 0 0 0 5.3 1.3h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.1-1.2-6.1-3.5-8.3ZM12.2 21.5h-.1c-1.7 0-3.4-.5-4.8-1.3l-.3-.2-3.9 1 1-3.8-.2-.3a9.7 9.7 0 1 1 8.3 4.6Zm5.3-7.3c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-1.6-.8-2.6-1.4-3.7-3.2-.3-.5.3-.5.8-1.7.1-.2.1-.4 0-.6-.1-.2-.7-1.7-.9-2.3-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1-1.1 2.5s1.1 2.9 1.3 3.1c.2.2 2.2 3.4 5.4 4.7.8.3 1.4.5 1.8.6.8.2 1.5.2 2 .1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.1-1.4-.1-.2-.3-.3-.6-.4Z"/>
          </svg>
        </a>

        <a
          class="contact-btn messenger"
          href="https://m.me/tomasz.pawlak.54"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Messenger — skontaktuj się"
          title="Messenger">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 1.8C5.8 1.8 1 6.3 1 12c0 3.2 1.6 6.1 4.3 8.1V24l3.9-2.1c.9.2 1.8.3 2.8.3 6.2 0 11-4.5 11-10.2S18.2 1.8 12 1.8Zm1 13.6-2.8-3-5.5 3 6-6.4 2.8 3 5.4-3-5.9 6.4Z"/>
          </svg>
        </a>
      </div>
    </div>

    <div class="footer-copy">
      <div>© 2026 TESTREKRUT.</div>
      <div>Wszelkie prawa zastrzeżone.</div>
    </div>

  </footer>

</div>

</body>
</html>
