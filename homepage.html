<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TESTREKRUT — Przygotuj się do rekrutacji</title>
<meta name="description" content="TESTREKRUT — platforma przygotowująca do testów wiedzy do Straży Granicznej i Policji.">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#061019;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

.stage{
  position:relative;
  width:100vw;
  max-width:none;
  margin:0;
  line-height:0;
}

.design{
  display:block;
  width:100vw;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}

/* Zakrywamy WYŁĄCZNIE nieaktywne menu po prawej.
   Logo TESTREKRUT po lewej pozostaje widoczne. */
.top-nav-cover{
  position:absolute;
  z-index:5;
  top:0;
  right:0;
  width:38%;
  height:12.5%;
  background:linear-gradient(
    180deg,
    rgba(5,15,23,.97) 0%,
    rgba(5,15,23,.90) 68%,
    rgba(5,15,23,0) 100%
  );
  pointer-events:none;
}

/* Całe karty są klikalne */
.hit{
  position:absolute;
  display:block;
  z-index:10;
  cursor:pointer;
  border-radius:20px;
  -webkit-tap-highlight-color:transparent;
}

.hit:hover{
  background:rgba(255,255,255,.025);
}

.sg-card{
  left:3.25%;
  top:45.25%;
  width:35.7%;
  height:31.4%;
}

.police-card{
  left:40.25%;
  top:45.25%;
  width:35.7%;
  height:31.4%;
}

/* Mały panel kontaktowy */
.contact-box{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:100;
  width:238px;
  padding:11px 12px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:12px;
  background:rgba(6,16,25,.92);
  backdrop-filter:blur(12px);
  box-shadow:0 12px 35px rgba(0,0,0,.42);
  line-height:normal;
}

.contact-title{
  color:#e3ebf1;
  font-size:8px;
  font-weight:800;
  letter-spacing:1.05px;
  text-align:center;
  margin-bottom:8px;
}

.contact-buttons{
  display:flex;
  gap:6px;
}

.contact-btn{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:0 7px;
  border-radius:8px;
  background:#0b1b30;
  color:#fff;
  text-decoration:none;
  font-size:9px;
  font-weight:800;
  transition:transform .15s,filter .15s;
}

.contact-btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.1);
}

.contact-btn.whatsapp{
  border:1px solid #1fa45c;
}

.contact-btn.messenger{
  border:1px solid #5278b8;
}

.contact-note{
  color:#8292a5;
  font-size:8px;
  text-align:center;
  line-height:1.3;
  margin-top:6px;
}

@media(max-width:700px){
  .contact-box{
    right:10px;
    bottom:10px;
    left:10px;
    width:auto;
    max-width:290px;
    margin-left:auto;
    padding:10px;
  }

  .contact-btn{
    min-height:36px;
    font-size:9px;
  }
}
</style>
</head>

<body>

<div class="stage">

  <img
    class="design"
    src="homepage-design.png"
    alt="TESTREKRUT — przygotuj się do rekrutacji"
  >

  <!-- Ukrywa tylko nieaktywne zakładki. Logo zostaje widoczne. -->
  <div class="top-nav-cover" aria-hidden="true"></div>

  <!-- Straż Graniczna -->
  <a
    class="hit sg-card"
    href="/SG/"
    aria-label="Przejdź do testu Straż Graniczna">
  </a>

  <!-- Policja -->
  <a
    class="hit police-card"
    href="/policja/"
    aria-label="Przejdź do testu Policja">
  </a>

</div>

<!-- Działające przyciski kontaktowe -->
<div class="contact-box">

  <div class="contact-title">
    MASZ PYTANIE? SKONTAKTUJ SIĘ
  </div>

  <div class="contact-buttons">

    <a
      class="contact-btn whatsapp"
      href="https://wa.me/48608737181"
      target="_blank"
      rel="noopener noreferrer">
      🟢 WhatsApp
    </a>

    <a
      class="contact-btn messenger"
      href="https://m.me/tomasz.pawlak.54"
      target="_blank"
      rel="noopener noreferrer">
      🔵 Messenger
    </a>

  </div>

  <div class="contact-note">
    Pytania dotyczące TESTREKRUT, zakupu i aktywacji dostępu.
  </div>

</div>

</body>
</html>
