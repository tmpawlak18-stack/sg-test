<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TESTREKRUT — Przygotuj się do rekrutacji</title>
<meta name="description" content="TESTREKRUT — platforma przygotowująca do testów wiedzy do Straży Granicznej i Policji.">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#061019}
body{font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
.stage{position:relative;width:100%;max-width:1536px;margin:0 auto;line-height:0}
.design{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hit{position:absolute;display:block;z-index:5;cursor:pointer;border-radius:20px}
.hit:hover{background:rgba(255,255,255,.025)}
.sg-card{left:3.25%;top:45.25%;width:35.7%;height:31.4%}
.police-card{left:40.25%;top:45.25%;width:35.7%;height:31.4%}
@media(max-width:700px){
  .stage{min-width:760px;margin-left:50%;transform:translateX(-50%)}
}
</style>
</head>
<body>
<div class="stage">
<img class="design" src="homepage-design.png" alt="TESTREKRUT — przygotowanie do rekrutacji">
<a class="hit sg-card" href="/SG/" aria-label="Przejdź do testu Straż Graniczna"></a>
<a class="hit police-card" href="/policja/" aria-label="Przejdź do testu Policja"></a>
</div>
</body>
</html>
