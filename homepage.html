<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TESTREKRUT — Przygotuj się do rekrutacji</title>
<meta name="description" content="TESTREKRUT — platforma przygotowująca do testów wiedzy do Straży Granicznej i Policji.">

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#061019}
body{font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}

.stage{
  position:relative;
  width:100vw;
  margin:0;
  line-height:0;
}

.design{
  display:block;
  width:100vw;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}

/* Ukrywamy tylko nieaktywne zakładki po prawej.
   Logo TESTREKRUT po lewej pozostaje widoczne. */
.top-nav-cover{
  position:absolute;
  z-index:5;
  top:0;
  right:0;
  width:38%;
  height:12.5%;
  background:linear-gradient(
    180deg,
    rgba(5,15,23,.97) 0%,
    rgba(5,15,23,.90) 68%,
    rgba(5,15,23,0) 100%
  );
  pointer-events:none;
}

/* Całe karty są klikalne */
.hit{
  position:absolute;
  display:block;
  z-index:10;
  cursor:pointer;
  border-radius:20px;
  -webkit-tap-highlight-color:transparent;
}
.hit:hover{background:rgba(255,255,255,.025)}

.sg-card{
  left:3.25%;
  top:45.25%;
  width:35.7%;
  height:31.4%;
}

.police-card{
  left:40.25%;
  top:45.25%;
  width:35.7%;
  height:31.4%;
}

/* Statyczny kontakt w stopce */
.contact-footer-bg{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:74px;
  z-index:15;
  background:rgba(4,13,21,.97);
  border-top:1px solid rgba(255,255,255,.12);
  pointer-events:none;
}

.contact-footer{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  min-height:74px;
  padding:11px 3.2%;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:14px;
  z-index:20;
  line-height:normal;
}

.contact-label{
  color:#b8c5cf;
  font-size:10px;
  font-weight:700;
  letter-spacing:.65px;
  white-space:nowrap;
}

.contact-buttons{
  display:flex;
  gap:8px;
}

.contact-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:116px;
  height:38px;
  padding:0 14px;
  border-radius:8px;
  color:#fff;
  text-decoration:none;
  font-size:10px;
  font-weight:800;
  letter-spacing:.2px;
  transition:transform .15s,filter .15s;
}

.contact-btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.1);
}

.contact-btn.whatsapp{
  background:#08783f;
  border:1px solid #2bd47c;
}

.contact-btn.messenger{
  background:#1557c5;
  border:1px solid #5794ff;
}

@media(max-width:700px){
  .contact-footer,
  .contact-footer-bg{
    height:100px;
    min-height:100px;
  }

  .contact-footer{
    padding:10px 14px;
    flex-direction:column;
    justify-content:center;
    gap:8px;
  }

  .contact-label{
    font-size:9px;
  }

  .contact-buttons{
    width:100%;
    max-width:320px;
  }

  .contact-btn{
    flex:1;
    min-width:0;
    height:37px;
    font-size:9px;
  }
}
</style>
</head>

<body>

<div class="stage">

  <img
    class="design"
    src="homepage-design.png"
    alt="TESTREKRUT — przygotuj się do rekrutacji"
  >

  <!-- Nieaktywne zakładki są ukryte; logo pozostaje widoczne. -->
  <div class="top-nav-cover" aria-hidden="true"></div>

  <!-- Klikalne karty -->
  <a class="hit sg-card"
     href="/SG/"
     aria-label="Przejdź do testu Straż Graniczna"></a>

  <a class="hit police-card"
     href="/policja/"
     aria-label="Przejdź do testu Policja"></a>

  <!-- Statyczny kontakt -->
  <div class="contact-footer-bg" aria-hidden="true"></div>

  <div class="contact-footer">

    <div class="contact-label">
      MASZ PYTANIE? SKONTAKTUJ SIĘ Z NAMI:
    </div>

    <div class="contact-buttons">

      <a class="contact-btn whatsapp"
         href="https://wa.me/48608737181"
         target="_blank"
         rel="noopener noreferrer">
        🟢 WhatsApp
      </a>

      <a class="contact-btn messenger"
         href="https://m.me/tomasz.pawlak.54"
         target="_blank"
         rel="noopener noreferrer">
        🔵 Messenger
      </a>

    </div>

  </div>

</div>

</body>
</html>
