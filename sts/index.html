.contact-field{
  display:block;
  margin:0 0 11px;
}
.contact-field>span{
  display:block;
  color:#bfcbd7;
  font-size:10px;
  font-weight:850;
  margin:0 0 6px;
  text-transform:uppercase;
  letter-spacing:.35px;
}
.contact-field>span b{color:#d77a84}
.contact-field>span em{
  color:#708093;

  font-weight:600;
  text-transform:none;
  letter-spacing:0;
}
.contact-field input,
.contact-field select,
.contact-field textarea{
  box-sizing:border-box;
  width:100%;
  border:1px solid #33485c;

  background:#091725;
  color:#eef3f7;

  font-size:13px;
  outline:none;

}

.contact-field textarea::placeholder{color:#617184}
.contact-field select{color:#dfe7ee}
.contact-field input:focus,
.contact-field select:focus,
.contact-field textarea:focus{

.contact-form-bottom{

}
.contact-submit{
  flex:0 0 auto;
  min-height:44px;
  padding:10px 15px;

  border-radius:10px;

  font-size:13px;

.contact-submit:hover{filter:brightness(1.08);transform:translateY(-1px)}

.contact-status{

  border-radius:10px;

  font-weight:750;

.contact-status.error{

  background:rgba(112,22,38,.24);

@media(max-width:600px){

const EXAM_COUNT = 40;
const EXAM_MINUTES = 60;
const state = {
  mode:"home", pool:[], pos:0, score:0, wrong:[], answers:{},
  history: JSON.parse(localStorage.getItem("sts01Wrong") || "[]"),
  examDeadline:0, timer:null, expanded:{}

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function saveHistory(){localStorage.setItem("sts01Wrong",JSON.stringify(state.history))}
function stopTimer(){if(state.timer){clearInterval(state.timer);state.timer=null}}
function formatTime(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function updateTimer(){
  if(state.mode!=="exam") return;
  const left=Math.max(0,state.examDeadline-Date.now());
  const el=document.getElementById("timer");
  if(el){el.textContent="⏱ "+formatTime(Math.ceil(left/1000));el.classList.toggle("warn",left<=5*60*1000)}
  const mt=document.getElementById("topTimerMobile");
  if(mt)mt.textContent=formatTime(Math.ceil(left/1000));
  if(left<=0){stopTimer();finishExam(true)}
}
function setActive(){document.body.classList.add("test-active")}
function clearActive(){document.body.classList.remove("test-active");const m=document.getElementById("mobileTestStatus");if(m)m.innerHTML=""}

function goHome(){stopTimer();clearActive();state.mode="home";renderHome()}
function renderHome(){
  clearActive();
  document.getElementById("app").innerHTML=`
    <section class="sts-landing-center">
      <div class="sts-brand">TESTREKRUT • STS-01</div>
      <h1>Centrum przygotowania do egzaminu STS-01</h1>
      <div class="sts-lead">Ucz się z pełnej bazy pytań, rozwiązuj losowy egzamin i sprawdzaj błędy. <b>Dostęp jest całkowicie swobodny — bez kodów i bez logowania.</b></div>
      <div class="sts-points">
        <span class="sts-point">250 pytań</span><span class="sts-point">8 działów</span><span class="sts-point">40 pytań na egzaminie</span><span class="sts-point">60 minut</span><span class="sts-point">Analiza błędów</span>
      </div>
      <div class="sts-grid">
        <div class="sts-tile"><strong>📚 Nauka</strong><span>Losowo przechodzisz przez bazę i od razu widzisz prawidłową odpowiedź.</span></div>
        <div class="sts-tile"><strong>🎯 Egzamin</strong><span>40 losowych pytań, 60 minut, wynik dopiero po zakończeniu.</span></div>
        <div class="sts-tile"><strong>📖 Baza</strong><span>Przeglądaj wszystkie 250 pytań, filtruj działy i wyszukuj treść.</span></div>
        <div class="sts-tile"><strong>⚑ Błędy</strong><span>Pomyłki są zapisywane lokalnie w tej przeglądarce.</span></div>
      </div>
      <div class="menu">
        <button onclick="showLearn()">📚 Rozpocznij naukę</button>
        <button onclick="startExam()">🎯 Egzamin — 40 pytań / 60 min</button>
        <button class="secondary" onclick="showDatabase()">📖 Otwórz bazę 250 pytań</button>
        <button class="secondary" onclick="showWrong()">🔴 Moje błędy (${state.history.length})</button>
      </div>
      <div class="mode-note">W trybie egzaminacyjnym odpowiedzi nie są ujawniane w trakcie rozwiązywania. Po zakończeniu zobaczysz wynik oraz pytania, na których popełniłeś błąd.</div>
    </section>`;
}

function showLearn(){
  stopTimer(); clearActive();
  state.mode="learn"; state.pool=shuffle(QUESTIONS); state.pos=0; state.score=0; state.wrong=[]; state.answers={};
  renderQuestion();
}
function showWrong(){
  stopTimer(); clearActive();
  const p=state.history.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);
  if(!p.length){alert("Nie masz jeszcze zapisanych błędów.");return}
  state.mode="wrong"; state.pool=shuffle(p); state.pos=0; state.score=0; state.wrong=[]; state.answers={};
  renderQuestion();
}
function resetWrong(){state.history=[];saveHistory();renderHome()}

function updateMobileStatus(){
  const m=document.getElementById("mobileTestStatus");
  if(!m)return;
  const label=state.mode==="exam"?"EGZAMIN":state.mode==="wrong"?"BŁĘDNE":"NAUKA";
  m.innerHTML=`<span class="mts-mode">${label}</span><span class="mts-question">Pytanie ${state.pos+1} / ${state.pool.length}</span>${state.mode==="exam"?`<span class="mts-timer" id="topTimerMobile">${formatTime(Math.ceil((state.examDeadline-Date.now())/1000))}</span>`:""}<button class="mts-end" type="button" onclick="${state.mode==="exam"?"finishExam(false)":"goHome()"}">${state.mode==="exam"?"ZAKOŃCZ":"MENU"}</button>`;
}

function renderQuestion(){
  if(state.pos>=state.pool.length){state.mode==="exam"?finishExam(false):finishLearning();return}
  setActive(); updateMobileStatus();
  const x=state.pool[state.pos];
  const selected=state.answers[x.id];
  const isAnswered=selected!==undefined;
  const labels=["A","B","C","D"];
  document.getElementById("app").innerHTML=`
    <div class="progress-wrap">
      <div class="progress-head"><span>${state.mode==="exam"?"EGZAMIN":"NAUKA"} • ${esc(x.category)}</span><b>${state.pos+1}/${state.pool.length}</b></div>
      <div class="bar"><div class="fill" style="width:${((state.pos+1)/state.pool.length)*100}%"></div></div>
    </div>
    <div class="card">
      <div class="question-label">PYTANIE ${state.pos+1}</div>
      <div class="q">${esc(x.question)}</div>
      ${state.mode==="exam"?`<div class="exam-meta"><span class="meta"><b>${esc(x.category)}</b></span><span id="timer" class="timer-big">${formatTime(Math.ceil((state.examDeadline-Date.now())/1000))}</span></div>`:""}
      <div class="${state.mode==="exam"?"exam-answer-grid":"answers"}" style="margin-top:16px">
        ${x.options.map((o,i)=>{
          const cls=state.mode==="exam"
            ? (selected===i?"exam-option selected":"exam-option")
            : (isAnswered?(i===x.correct?"ans good":i===selected?"ans bad":"ans disabled"):"ans");
          return `<button class="${cls}" onclick="chooseAnswer(${i})" ${state.mode!=="exam"&&isAnswered?"disabled":""}><b>${labels[i]}</b><span>${esc(o)}</span></button>`;
        }).join("")}
      </div>
      ${state.mode!=="exam"&&isAnswered?`<div class="feedback ${selected===x.correct?"goodbox":"badbox"}">${selected===x.correct?"✓ Poprawna odpowiedź!":"✕ Niepoprawna odpowiedź."} <span style="font-weight:600">${selected!==x.correct?"Prawidłowa: "+labels[x.correct]+". "+esc(x.options[x.correct]):""}</span></div>`:""}
      ${state.mode==="exam"?renderExamNav():`
      <div class="controls">
        <button class="secondary" onclick="${state.pos>0?"prevQuestion()":"goHome()"}">${state.pos>0?"← Poprzednie":"← Menu"}</button>
        <button onclick="${isAnswered?"nextQuestion()":"void(0)"}" ${isAnswered?"":"disabled style='opacity:.45;cursor:not-allowed'"}>${state.pos===state.pool.length-1?"Zakończ":"Dalej →"}</button>
      </div>`}
    </div>`;
  if(state.mode==="exam"){updateTimer(); if(!state.timer)state.timer=setInterval(updateTimer,250)}
}
function renderExamNav(){
  return `<div class="exam-nav">${state.pool.map((q,i)=>{
    const done=state.answers[q.id]!==undefined;
    return `<button class="${i===state.pos?"active ":""}${done?"done":""}" onclick="jumpExam(${i})">${i+1}</button>`;
  }).join("")}</div>
  <div class="exam-bottom">
    <div class="left"><button class="secondary" onclick="${state.pos>0?"prevQuestion()":"goHome()"}">← ${state.pos>0?"Poprzednie":"Menu"}</button><button class="secondary" onclick="${state.pos<state.pool.length-1?"nextQuestion()":"jumpExam(0)"}">${state.pos<state.pool.length-1?"Następne →":"Wróć do 1"}</button></div>
    <div class="right"><button onclick="finishExam(false)">✓ Zakończ egzamin</button></div>
  </div>`;
}
function chooseAnswer(i){
  const x=state.pool[state.pos];
  if(state.mode==="exam"){state.answers[x.id]=i;renderQuestion();return}
  if(state.answers[x.id]!==undefined)return;
  state.answers[x.id]=i;
  if(i===x.correct)state.score++;
  else {state.wrong.push(x.id);if(!state.history.includes(x.id))state.history.push(x.id);saveHistory()}
  renderQuestion();
}
function nextQuestion(){state.pos++;renderQuestion()}
function prevQuestion(){if(state.pos>0){state.pos--;renderQuestion()}}
function jumpExam(i){state.pos=i;renderQuestion()}

function startExam(){
  stopTimer(); clearActive();
  state.mode="exam";state.pool=shuffle(QUESTIONS).slice(0,EXAM_COUNT);state.pos=0;state.score=0;state.wrong=[];state.answers={};
  state.examDeadline=Date.now()+EXAM_MINUTES*60*1000;
  renderQuestion(); updateTimer();
}
function finishExam(timeout){
  stopTimer();
  const total=state.pool.length;
  let score=0, wrong=[], unanswered=0;
  state.pool.forEach(q=>{
    const a=state.answers[q.id];
    if(a===undefined)unanswered++;
    else if(a===q.correct)score++;
    else {wrong.push(q.id);if(!state.history.includes(q.id))state.history.push(q.id)}
  });
  saveHistory();
  state.score=score;state.wrong=wrong;
  state.mode="result";
  clearActive();
  const pct=Math.round(score/total*100);
  const cards=wrong.map(id=>{
    const q=QUESTIONS.find(x=>x.id===id), a=state.answers[id];
    return `<article class="result-error"><div class="result-error-head"><span class="result-error-number">Pytanie ${state.pool.findIndex(x=>x.id===id)+1}</span><span class="result-error-badge">BŁĄD</span></div><div class="result-question">${esc(q.question)}</div><div class="result-answer">${a===undefined?"<div class='error-note'>Brak odpowiedzi</div>":`<div class="result-answer-line wrong-answer"><span class="result-answer-label">Twoja</span><span class="result-answer-value">${["A","B","C","D"][a]}. ${esc(q.options[a])}</span></div>`}<div class="result-answer-line correct-answer"><span class="result-answer-label">Prawidłowa</span><span class="result-answer-value">${["A","B","C","D"][q.correct]}. ${esc(q.options[q.correct])}</span></div></div></article>`;
  }).join("");
  document.getElementById("app").innerHTML=`
    <div class="card result-card">
      <div class="question-label">WYNIK EGZAMINU</div>
      <h1>${timeout?"Czas minął":"Egzamin zakończony"}</h1>
      ${timeout?`<div class="feedback badbox">⏰ Wykorzystano pełne 60 minut.</div>`:""}
      <div class="result-score">
        <div class="result-score-main"><span class="score-number">${score}/${total}</span><span class="score-label">Wynik</span></div>
        <div class="result-stat"><strong>${pct}%</strong><span>Skuteczność</span></div>
        <div class="result-stat"><strong>${wrong.length}</strong><span>Błędy</span></div>
        <div class="result-stat"><strong>${unanswered}</strong><span>Bez odpowiedzi</span></div>
      </div>
      <div class="menu result-actions">
        <button onclick="startExam()">🔄 Nowy egzamin</button>
        <button onclick="showWrong()">🔴 Przećwicz błędy (${wrong.length})</button>
        <button class="secondary" onclick="goHome()">← Menu</button>
      </div>
      ${wrong.length?`<div class="result-errors-title"><h2>❌ Pytania wymagające powtórki</h2><span class="result-errors-count">${wrong.length}</span></div><div class="result-error-list">${cards}</div>`:`<div class="result-errors-title"><h2>🎉 Wszystkie odpowiedzi poprawne</h2></div><div class="result-empty">Świetnie! Wszystkie odpowiedzi w tym egzaminie były poprawne.</div>`}
    </div>`;
}

function finishLearning(){
  clearActive();
  const total=state.pool.length;
  document.getElementById("app").innerHTML=`
    <div class="card">
      <div class="question-label">SESJA ZAKOŃCZONA</div><h1>Nauka zakończona</h1>
      <div class="result-score"><div class="result-score-main"><span class="score-number">${state.score}/${total}</span><span class="score-label">Poprawne</span></div><div class="result-stat"><strong>${Math.round(state.score/total*100)}%</strong><span>Skuteczność</span></div><div class="result-stat"><strong>${state.wrong.length}</strong><span>Błędy</span></div><div class="result-stat"><strong>${state.history.length}</strong><span>Do powtórki</span></div></div>
      <div class="menu result-actions"><button onclick="showLearn()">🔄 Ucz się ponownie</button><button onclick="showWrong()">🔴 Przećwicz błędy</button><button class="secondary" onclick="goHome()">← Menu</button></div>
    </div>`;
}

function showDatabase(){
  stopTimer();clearActive();state.mode="database";
  document.getElementById("app").innerHTML=`
    <div class="card result-card">
      <div class="question-label">BAZA PYTAŃ</div><h1>250 pytań STS-01</h1>
      <div class="small">Wyszukuj pytania i filtruj je według działu. Kliknij pytanie, aby rozwinąć odpowiedzi.</div>
      <div class="db-toolbar"><input id="dbSearch" placeholder="🔎 Szukaj w pytaniach..." oninput="renderDatabase()"><select id="dbCat" onchange="renderDatabase()"><option value="">Wszystkie działy</option>${[...new Set(QUESTIONS.map(q=>q.category))].map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
      <div id="dbList" class="db-list"></div>
      <div class="controls"><button class="secondary" onclick="goHome()">← Menu</button></div>
    </div>`;
  renderDatabase();
}
function renderDatabase(){
  const s=(document.getElementById("dbSearch")?.value||"").toLowerCase().trim();
  const c=document.getElementById("dbCat")?.value||"";
  const list=QUESTIONS.filter(q=>(!c||q.category===c)&&(!s||(q.question+" "+q.options.join(" ")).toLowerCase().includes(s)));
  document.getElementById("dbList").innerHTML=list.map(q=>{
    const open=state.expanded[q.id];
    return `<div class="db-item"><div class="db-q" onclick="toggleDb(${q.id})"><div class="db-meta">Pytanie ${q.sourceQuestion} • ${esc(q.category)}</div><strong>${esc(q.question)}</strong></div>${open?`<div class="db-options">${q.options.map((o,i)=>`<div class="db-option ${i===q.correct?"correct":""}">${i===q.correct?"✓ ":""}${["A","B","C","D"][i]}. ${esc(o)}</div>`).join("")}</div>`:""}</div>`;
  }).join("") || `<div class="result-empty">Brak wyników dla podanych kryteriów.</div>`;
}
function toggleDb(id){state.expanded[id]=!state.expanded[id];renderDatabase()}

renderHome();
</script>
</body></html>
